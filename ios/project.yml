name: GhosttyConnect
options:
  bundleIdPrefix: dev.ghostty
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
targets:
  GhosttyConnect:
    type: application
    platform: iOS
    sources:
      - GhosttyConnect
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ghostty.connect
        PRODUCT_NAME: Ghostty Connect
        PRODUCT_MODULE_NAME: GhosttyConnect
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Ghostty Connect
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: NO
        TARGETED_DEVICE_FAMILY: "1,2"
  GhosttyConnectTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - GhosttyConnectTests
    dependencies:
      - target: GhosttyConnect
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
