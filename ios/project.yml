name: GhosttyConnect
options:
  bundleIdPrefix: fail.founder
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 6GRZ874TZY
    FRAMEWORK_SEARCH_PATHS: "$(inherited) $(PROJECT_DIR)/Vendor"
packages:
  Citadel:
    url: https://github.com/orlandos-nl/Citadel.git
    exactVersion: 0.12.1
targets:
  GhosttyConnect:
    type: application
    platform: iOS
    info:
      path: GhosttyConnect/Info.plist
      properties:
        CFBundleDisplayName: Seance Shell
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: fail.founder.terminal
            CFBundleURLSchemes:
              - seance-shell
              - ghostty-connect
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: Seance Shell connects to SSH servers on your local network when you choose a local host.
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UILaunchScreen: {}
    sources:
      - GhosttyConnect
    dependencies:
      - framework: Vendor/ghostty-vt.xcframework
        embed: false
      - package: Citadel
      - target: GhosttyConnectControl
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fail.founder.terminal
        PRODUCT_NAME: Seance Shell
        PRODUCT_MODULE_NAME: GhosttyConnect
        CURRENT_PROJECT_VERSION: 2
        MARKETING_VERSION: 0.1.0
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
  GhosttyConnectControl:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - GhosttyConnectControl
    info:
      path: GhosttyConnectControl/Info.plist
      properties:
        CFBundleDisplayName: Quick Connect
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fail.founder.terminal.quick-connect
        PRODUCT_NAME: Quick Connect
        PRODUCT_MODULE_NAME: GhosttyConnectControl
        CURRENT_PROJECT_VERSION: 2
        MARKETING_VERSION: 0.1.0
        SKIP_INSTALL: YES
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
  GhosttyConnectTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - GhosttyConnectTests
    dependencies:
      - target: GhosttyConnect
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Seance Shell.app/Seance Shell"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  GhosttyConnect:
    build:
      targets:
        GhosttyConnect: all
        GhosttyConnectTests: [test]
    test:
      targets:
        - GhosttyConnectTests
